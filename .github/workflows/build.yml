name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: performance-monitor-windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: performance-monitor-linux-x64
          - os: macos-14
            rid: osx-x64
            artifact: performance-monitor-macos-x64
          - os: macos-latest
            rid: osx-arm64
            artifact: performance-monitor-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish
        run: >
          dotnet publish "Performance Monitor/Performance Monitor/Performance Monitor.csproj"
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
