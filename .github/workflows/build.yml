name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: performance-monitor-windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: performance-monitor-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            PerformanceMonitor.Shared/PerformanceMonitor.Shared.csproj
            PerformanceMonitor.Desktop/PerformanceMonitor.Desktop.csproj
      - name: Publish
        run: >
          dotnet publish "PerformanceMonitor.Desktop/PerformanceMonitor.Desktop.csproj"
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -p:DebugSymbols=false
          -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Install Android SDK components
        run: |
          mkdir -p "$HOME/android-sdk"
          dotnet build PerformanceMonitor.Android/PerformanceMonitor.Android.csproj \
            -t:InstallAndroidDependencies -f net10.0-android \
            -p:AndroidSdkDirectory="$HOME/android-sdk" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AcceptAndroidSdkLicenses=True

      - name: Decode release keystore
        if: env.KEYSTORE_B64 != ''
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Publish APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          SIGN_ARGS=()
          if [ -n "$KEYSTORE_B64" ]; then
            SIGN_ARGS=(
              -p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
              -p:AndroidSigningKeyPass=env:ANDROID_KEYSTORE_PASSWORD
              -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
            )
          else
            echo "No keystore secret found: building with the default debug key (test builds only)."
          fi

          dotnet publish PerformanceMonitor.Android/PerformanceMonitor.Android.csproj \
            -f net10.0-android -c Release \
            -p:AndroidSdkDirectory="$HOME/android-sdk" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidPackageFormats=apk \
            -p:PublishTrimmed=false \
            -p:ApplicationVersion=${{ github.run_number }} \
            -p:ApplicationDisplayVersion=1.0.${{ github.run_number }} \
            "${SIGN_ARGS[@]}"

      - name: Collect APK
        run: |
          mkdir -p apk-out
          f=$(find PerformanceMonitor.Android/bin/Release -iname '*-signed.apk' | head -n 1)
          if [ -z "$f" ]; then
            echo "No signed APK found. Package files present:"
            find PerformanceMonitor.Android/bin/Release \( -name '*.apk' -o -name '*.aab' \)
            exit 1
          fi
          cp "$f" "apk-out/PerformanceMonitor-android-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: performance-monitor-android
          path: apk-out/*.apk
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare direct-download assets
        run: |
          mkdir -p release
          cp "$(find artifacts/performance-monitor-windows-x64 -name 'PerformanceMonitor.Desktop.exe' -type f | head -n 1)" release/PerformanceMonitor-Windows.exe
          cp "$(find artifacts/performance-monitor-linux-x64 -name 'PerformanceMonitor.Desktop' -type f | head -n 1)" release/PerformanceMonitor-Linux
          cp "$(find artifacts/performance-monitor-android -name '*.apk' -type f | head -n 1)" release/PerformanceMonitor-Android.apk
          chmod +x release/PerformanceMonitor-Linux

      - name: Build Linux installer
        run: |
          mkdir -p release/deb/DEBIAN release/deb/usr/bin release/deb/usr/share/applications release/deb/usr/share/icons/hicolor/256x256/apps
          cp release/PerformanceMonitor-Linux release/deb/usr/bin/performance-monitor
          chmod 755 release/deb/usr/bin/performance-monitor
          cp PerformanceMonitor.Shared/Assets/Duck.png release/deb/usr/share/icons/hicolor/256x256/apps/performance-monitor.png
          cat > release/deb/DEBIAN/control <<'EOF'
          Package: performance-monitor
          Version: 1.0.${{ github.run_number }}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Performance Monitor
          Recommends: radeontop
          Description: Cross-platform hardware performance monitor.
          EOF
          cat > release/deb/usr/share/applications/performance-monitor.desktop <<'EOF'
          [Desktop Entry]
          Name=Performance Monitor
          Exec=performance-monitor
          Icon=performance-monitor
          Terminal=false
          Type=Application
          Categories=System;Monitor;
          EOF
          dpkg-deb --build release/deb release/PerformanceMonitor-Linux.deb
          rm -rf release/deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" release/* \
            --title "Performance Monitor build ${GITHUB_RUN_NUMBER}" \
            --notes "Direct downloads: Windows .exe, Linux .deb or executable, Android .apk. No zip required." \
            --latest || gh release upload "$tag" release/* --clobber
